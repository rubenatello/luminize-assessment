<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="t d"><title id="t">Confidence-based identity resolution</title><desc id="d">Five matching levels from exact SKU to quarantine.</desc><rect width="1100" height="500" fill="#fff"/><text x="40" y="48" font-family="Arial" font-size="26" font-weight="700" fill="#0B2545">Resolve identity with confidence—not forced perfection</text>
<g font-family="Arial"><g font-size="28" font-weight="700" text-anchor="middle"><text x="90" y="126" fill="#0B7A53">100</text><text x="90" y="206" fill="#0B7A53">95</text><text x="90" y="286" fill="#B7791F">85</text><text x="90" y="366" fill="#2E74B5">60</text><text x="90" y="446" fill="#B42318">0</text></g>
<g font-size="21" fill="#172B4D"><text x="160" y="126">Exact canonical SKU</text><text x="160" y="206">Proposed / approved SKU alias</text><text x="160" y="286">Unique marketplace-scoped ASIN</text><text x="160" y="366">Approved brand or SKU prefix</text><text x="160" y="446">Missing or conflicting identifiers</text></g>
<g font-size="19" font-weight="700"><text x="790" y="126" fill="#0B7A53">Publish</text><text x="790" y="206" fill="#0B7A53">Publish + monitor</text><text x="790" y="286" fill="#B7791F">Provisional</text><text x="790" y="366" fill="#2E74B5">Brand reporting only</text><text x="790" y="446" fill="#B42318">Quarantine</text></g>
