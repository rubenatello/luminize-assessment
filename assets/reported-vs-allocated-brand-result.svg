<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">Reported contribution margin versus run-rate threshold by brand</title>
  <desc id="desc">GlowTheory declines from 20.5 thousand dollars to positive 2.2 thousand. Peak Fuel declines from 22.0 thousand to negative 1.8 thousand. PawHaus declines from 8.7 thousand to negative 5.8 thousand.</desc>
  <rect width="1000" height="410" rx="18" fill="#F7F9FC"/>
  <text x="28" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172B4D">Shared costs test the brand story</text>
  <text x="28" y="62" font-family="Arial, sans-serif" font-size="14" fill="#5E6C84">Reported contribution margin vs. estimated run-rate threshold</text>

  <rect x="650" y="27" width="18" height="12" rx="2" fill="#137C8B"/>
  <text x="676" y="38" font-family="Arial, sans-serif" font-size="13" fill="#344563">Reported CM</text>
  <rect x="798" y="27" width="18" height="12" rx="2" fill="#F4B942"/>
  <text x="824" y="38" font-family="Arial, sans-serif" font-size="13" fill="#344563">Run-rate threshold</text>

  <line x1="343" y1="78" x2="343" y2="342" stroke="#7A869A" stroke-width="1.5"/>
  <line x1="217" y1="342" x2="919" y2="342" stroke="#C1C7D0" stroke-width="1"/>
  <line x1="217" y1="337" x2="217" y2="347" stroke="#C1C7D0"/>
  <line x1="343" y1="337" x2="343" y2="347" stroke="#7A869A"/>
  <line x1="594" y1="337" x2="594" y2="347" stroke="#C1C7D0"/>
  <line x1="845" y1="337" x2="845" y2="347" stroke="#C1C7D0"/>

  <text x="24" y="118" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172B4D">GlowTheory</text>
  <rect x="343" y="88" width="515" height="22" rx="4" fill="#137C8B"/>
  <rect x="343" y="118" width="55" height="22" rx="4" fill="#F4B942"/>
  <text x="866" y="104" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#137C8B">$20.5K</text>
  <text x="406" y="134" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#7A5100">$2.2K</text>

  <text x="24" y="208" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172B4D">Peak Fuel</text>
  <rect x="343" y="178" width="552" height="22" rx="4" fill="#137C8B"/>
  <rect x="297" y="208" width="46" height="22" rx="4" fill="#F4B942"/>
  <text x="903" y="194" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#137C8B">$22.0K</text>
  <text x="222" y="224" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#B64B3C">($1.8K)</text>

  <text x="24" y="298" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172B4D">PawHaus</text>
  <rect x="343" y="268" width="217" height="22" rx="4" fill="#137C8B"/>
  <rect x="197" y="298" width="146" height="22" rx="4" fill="#F4B942"/>
  <text x="568" y="284" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#137C8B">$8.7K</text>
  <text x="122" y="314" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#B64B3C">($5.8K)</text>

  <text x="202" y="369" font-family="Arial, sans-serif" font-size="12" fill="#5E6C84">($5K)</text>
  <text x="335" y="369" font-family="Arial, sans-serif" font-size="12" fill="#5E6C84">$0</text>
  <text x="578" y="369" font-family="Arial, sans-serif" font-size="12" fill="#5E6C84">$10K</text>
  <text x="829" y="369" font-family="Arial, sans-serif" font-size="12" fill="#5E6C84">$20K</text>
  <text x="28" y="394" font-family="Arial, sans-serif" font-size="12" fill="#7A869A">Estimated threshold only; shared platform costs are allocated by net-sales share.</text>
</svg>
