<text x="196" y="256" font-family="Arial, sans-serif" fill="white" font-size="15" font-weight="700">47.9% margin</text>
<text x="837.6753819803032" y="256" font-family="Arial, sans-serif" fill="#0B2545" font-size="17" font-weight="700">$20.5K</text>
<text x="162" y="357" font-family="Arial, sans-serif" fill="#0B2545" font-size="17" text-anchor="end">Peak Fuel</text>
<rect x="180" y="314" width="690.0" height="72" rx="3" fill="#2E74B5"/>
<text x="196" y="358" font-family="Arial, sans-serif" fill="white" font-size="15" font-weight="700">39.6% margin</text>
<text x="884.0" y="358" font-family="Arial, sans-serif" fill="#0B2545" font-size="17" font-weight="700">$22.0K</text>
</svg>